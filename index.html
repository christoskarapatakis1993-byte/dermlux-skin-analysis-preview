*{box-sizing:border-box}
:root{
  --blue:#1a1a1a; --blue-d:#000; --pale:#f4f2ed; --gold:#cebd63; --gold-d:#ad9d49; --gold-ink:#85762d;

}
html,body{margin:0;background:var(--bg);color:var(--ink);font:300 16px/1.62 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:600px;margin:0 auto;padding:26px 22px 72px}

.mast{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--hair);padding-bottom:12px;margin-bottom:22px}
.mast .z{display:flex;align-items:center;gap:10px;font:400 18px/1 var(--sans);letter-spacing:.02em;color:var(--ink);text-decoration:none}.mast .z img{height:24px;width:24px;display:block}
.mast .z sup{font-size:8px;letter-spacing:0}

.rail{display:flex;align-items:center;gap:9px;margin:0 0 26px}

.rail i.on{background:var(--blue)}
.rail .no{font:500 10px/1 var(--bold);letter-spacing:.2em;color:var(--mut);white-space:nowrap}

.inl{display:inline;font:inherit;letter-spacing:0;text-transform:none;color:inherit}
.consent a,.dis a,.warn a{color:var(--blue);text-decoration:underline;text-underline-offset:2px}
h1{font:300 34px/1.12 var(--serif);letter-spacing:-.015em;margin:0 0 10px}
h2{font:300 24px/1.22 var(--serif);letter-spacing:-.01em;margin:38px 0 12px}

.lede{color:var(--mut);font-size:15px;line-height:1.66;margin:0 0 26px}
.wl-img{display:block;width:100%;height:236px;object-fit:cover;object-position:50% 58%;border-radius:10px;margin:2px 0 26px;background:#efe6d4}
.wl-steps{list-style:none;margin:0 0 24px;padding:0}
.wl-steps li{display:flex;gap:16px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--hair)}
.wl-steps li:last-child{border-bottom:1px solid var(--hair)}
.wl-steps .n{flex:0 0 auto;font:500 10px/1.9 var(--bold);letter-spacing:.22em;color:var(--blue);padding-top:2px}

.wl-note{background:var(--wash);border:1px solid var(--hair);border-radius:10px;padding:15px 17px;font-size:14px;line-height:1.6;color:var(--mut);margin:0 0 24px}

p{margin:10px 0}
